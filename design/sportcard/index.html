<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=390, initial-scale=1" />
<title>NBA Live · 方案 B 运动卡片风</title>
<style>
/* ============================================================
   方案 B — Sport Card / Bold Sporty
   亮色运动风：深色基线 + 高饱和联赛色块 + 大圆角 + 渐变饰条
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;background:#05070F;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.stage{width:390px;margin:0 auto;}
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:#05070F;}

/* ---------- 主题变量 ---------- */
.screen{
  --bg:#0A0D18;
  --bg-2:#0F1424;
  --card:#161C33;
  --card-2:#1E2542;
  --card-3:#252D4E;
  --line:rgba(255,255,255,.10);
  --line-2:rgba(255,255,255,.18);
  --txt:#F4F7FF;
  --txt-2:#A7B0CC;
  --txt-3:#6E7799;
  --red:#FF3B4E;
  --orange:#FF8A3D;
  --nba:#3B82F6;
  --cba:#FF4D6D;
  --ok:#2FD07E;
  --warn:#FFC24B;
  --grad-live:linear-gradient(135deg,#FF2E4D 0%,#FF6B2C 52%,#FF8A3D 100%);
  --grad-red:linear-gradient(135deg,#FF3B4E 0%,#FF7A2F 100%);
  --shadow-1:0 4px 14px rgba(0,0,0,.34);
  --shadow-2:0 12px 30px rgba(0,0,0,.45);
  --shadow-red:0 10px 26px rgba(255,59,78,.32);
  position:absolute;inset:0;display:none;flex-direction:column;
  background:var(--bg);color:var(--txt);overflow:hidden;
}
.screen.active{display:flex;}
.screen[data-theme="light"]{
  --bg:#EDF0F8;
  --bg-2:#FFFFFF;
  --card:#FFFFFF;
  --card-2:#F4F6FC;
  --card-3:#E9EDF8;
  --line:rgba(18,28,60,.10);
  --line-2:rgba(18,28,60,.20);
  --txt:#0B1020;
  --txt-2:#4E5878;
  --txt-3:#818AA8;
  --red:#E01F3D;
  --orange:#F07A22;
  --nba:#2563EB;
  --cba:#E11D48;
  --ok:#0E9F5C;
  --warn:#C9820A;
  --grad-live:linear-gradient(135deg,#E8143A 0%,#FF6B2C 55%,#FF9A2E 100%);
  --grad-red:linear-gradient(135deg,#E01F3D 0%,#F5842B 100%);
  --shadow-1:0 4px 12px rgba(20,34,74,.08);
  --shadow-2:0 12px 26px rgba(20,34,74,.13);
  --shadow-red:0 10px 22px rgba(224,31,61,.24);
}

/* ---------- 通用 ---------- */
.sv-defs{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic-16{width:16px;height:16px}
.ic-22{width:22px;height:22px}
.ic-28{width:28px;height:28px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- 顶栏 ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px 0;flex:0 0 auto;
}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand-mark{
  width:36px;height:36px;border-radius:12px;flex:0 0 auto;
  background:var(--grad-live);display:grid;place-items:center;color:#fff;
  box-shadow:var(--shadow-red);
}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-size:18px;font-weight:900;letter-spacing:.6px;line-height:20px}
.brand-txt span{display:block;font-size:9.5px;letter-spacing:2.4px;color:var(--txt-3);font-weight:700;line-height:12px}
.spacer{flex:1 1 auto}
.scroll{
  flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
  padding-bottom:88px;-webkit-overflow-scrolling:touch;
}
.scroll::-webkit-scrollbar{width:0;height:0}
.scroll > .state{min-height:100%}
.icon-btn{
  width:48px;height:48px;flex:0 0 auto;border-radius:16px;
  background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--txt);
}
.icon-btn:active{background:var(--card-2)}
.icon-btn .ic-sun{display:none}
[data-theme="light"] .icon-btn .ic-sun{display:block}
[data-theme="light"] .icon-btn .ic-moon{display:none}

/* ---------- 分段控件 ---------- */
.seg{
  display:flex;gap:4px;padding:4px;margin:10px 16px 0;
  background:var(--card-2);border:1px solid var(--line);border-radius:18px;
  flex:0 0 auto;
}
.seg-btn{
  flex:1 1 0;min-width:0;height:48px;border:0;border-radius:14px;background:transparent;
  color:var(--txt-2);font-family:inherit;font-weight:800;font-size:14px;
  display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;
}
.seg-btn em{font-style:normal;font-size:11px;font-weight:800;opacity:.75}
.seg-btn.is-on{
  background:var(--grad-red);color:#fff;box-shadow:var(--shadow-red);
}
.seg-btn.is-on em{opacity:.9}

/* ---------- 速览条 ---------- */
.quick{
  display:flex;align-items:center;gap:6px;margin:8px 16px 0;flex:0 0 auto;
}
.quick-i{
  flex:1 1 0;min-width:0;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:7px 9px;box-shadow:var(--shadow-1);
  display:flex;align-items:baseline;justify-content:center;gap:5px;
}
.quick-i b{font-size:17px;font-weight:900;line-height:19px}
.quick-i span{font-size:10.5px;color:var(--txt-3);font-weight:700;white-space:nowrap}
.quick-i.live{border-color:rgba(255,59,78,.38);background:linear-gradient(180deg,rgba(255,59,78,.18),rgba(255,59,78,.04))}
.quick-i.live b{color:var(--red)}

/* ---------- 分组标题 ---------- */
.grp{
  display:flex;align-items:center;gap:8px;margin:9px 16px 6px;flex:0 0 auto;
}
.grp h2{margin:0;font-size:13.5px;font-weight:800;letter-spacing:.4px;line-height:18px}
.grp .tag{
  font-size:10px;font-weight:800;padding:2px 7px;border-radius:7px;
  background:var(--card-2);border:1px solid var(--line);color:var(--txt-3);
}
.grp .tag.hot{background:linear-gradient(135deg,#FF3B4E,#FF8A3D);color:#fff;border-color:transparent}
.grp .line{flex:1 1 auto;height:1px;background:var(--line)}

/* ---------- 直播主卡 ---------- */
.live-card{
  margin:0 16px;border-radius:24px;padding:12px 16px 13px;
  background:var(--grad-live);color:#fff;position:relative;overflow:hidden;
  box-shadow:var(--shadow-red);
}
.live-card::after{
  content:"";position:absolute;right:-42px;top:-52px;width:150px;height:150px;border-radius:50%;
  background:rgba(255,255,255,.14);
}
.live-card::before{
  content:"";position:absolute;right:6px;bottom:-58px;width:110px;height:110px;border-radius:50%;
  background:rgba(255,255,255,.10);
}
.lc-top{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.lc-live{
  display:flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:12px;
  background:rgba(12,6,10,.34);font-size:11.5px;font-weight:900;letter-spacing:.6px;
}
.dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.3s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.lc-time{margin-left:auto;font-size:12px;font-weight:800;opacity:.95}
.lc-body{display:flex;align-items:center;gap:8px;margin-top:10px;position:relative;z-index:1}
.lc-side{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px}
.lc-side b{font-size:16px;font-weight:900;letter-spacing:.5px;line-height:20px;white-space:nowrap}
.lc-vs{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  background:rgba(10,6,10,.28);display:grid;place-items:center;
  font-size:12px;font-weight:900;letter-spacing:.5px;
}
.lc-foot{
  display:flex;align-items:center;gap:8px;margin-top:10px;position:relative;z-index:1;
}
.lc-foot .chip{
  height:26px;padding:0 10px;border-radius:9px;background:rgba(12,6,10,.30);
  font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:5px;
}
.lc-foot .chip-btn{border:0;font-family:inherit;color:#fff;cursor:pointer}
.lc-foot .chip-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---------- 网格赛事卡 ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px}
.mcard{
  position:relative;overflow:hidden;border-radius:22px;background:var(--card);
  border:1px solid var(--line);box-shadow:var(--shadow-1);padding:0 0 11px;
  min-width:0;cursor:pointer;
}
.mcard:focus-visible,.hcard:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.mcard .strip{height:5px;width:100%}
.mcard .strip.nba{background:linear-gradient(90deg,#2563EB,#60A5FA)}
.mcard .strip.cba{background:linear-gradient(90deg,#E11D48,#FB923C)}
.mc-top{display:flex;align-items:center;gap:6px;padding:8px 11px 0}
.lg-chip{
  height:20px;padding:0 7px;border-radius:7px;font-size:9.5px;font-weight:900;letter-spacing:.6px;
  display:inline-flex;align-items:center;color:#fff;
}
.lg-chip.nba{background:linear-gradient(135deg,#2563EB,#3B82F6)}
.lg-chip.cba{background:linear-gradient(135deg,#E11D48,#FF6B6B)}
.sig-badge{
  margin-left:auto;display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;
  border-radius:7px;background:var(--card-3);color:var(--txt-2);
  font-size:9.5px;font-weight:800;white-space:nowrap;
}
.mc-time{display:flex;align-items:baseline;gap:5px;padding:6px 11px 0}
.mc-time b{font-size:21px;font-weight:900;letter-spacing:.4px;line-height:24px}
.mc-time span{font-size:10px;color:var(--txt-3);font-weight:700}
.mc-teams{display:flex;align-items:flex-start;justify-content:center;gap:6px;padding:7px 6px 0}
.mc-team{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.mc-team b{font-size:12px;font-weight:800;line-height:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc-vs{flex:0 0 auto;font-size:10px;font-weight:900;color:var(--txt-3);padding-top:20px}
.mc-foot{padding:8px 11px 0}
.st{
  display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:8px;
  font-size:10.5px;font-weight:800;white-space:nowrap;
}
.st.soon{background:rgba(59,130,246,.16);color:#7FB2FF;border:1px solid rgba(59,130,246,.28)}
.st.done{background:var(--card-3);color:var(--txt-3);border:1px solid var(--line)}
.st.live{background:linear-gradient(135deg,#FF2E4D,#FF7A2F);color:#fff;border-color:transparent}
[data-theme="light"] .st.soon{background:rgba(37,99,235,.12);color:#1D4ED8}

/* ---------- 队徽 ---------- */
.logo{position:relative;width:40px;height:40px;flex:0 0 auto;border-radius:50%;overflow:hidden;background:#fff}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo .fb{
  display:none;position:absolute;inset:0;background:var(--fb,#2A3352);color:#fff;
  align-items:center;justify-content:center;font-size:16px;font-weight:900;letter-spacing:0;
}
.logo.fail img{display:none}
.logo.fail .fb{display:flex}
.lg-40{width:36px;height:36px}
.lg-46{width:44px;height:44px}
.lg-56{width:56px;height:56px}
.lg-64{width:64px;height:64px}
.lg-72{width:72px;height:72px}
.lg-40 .fb{font-size:15px}.lg-46 .fb{font-size:18px}.lg-56 .fb{font-size:23px}
.lg-64 .fb{font-size:26px}.lg-72 .fb{font-size:30px}

/* ---------- 底部导航 ---------- */
.tabbar{
  position:absolute;left:0;right:0;bottom:0;height:88px;
  display:flex;align-items:flex-start;padding:8px 8px 0;
  background:linear-gradient(180deg,rgba(10,13,24,0),rgba(10,13,24,.96) 38%);
  border-top:1px solid var(--line);
  z-index:20;
}
[data-theme="light"] .tabbar{background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.97) 38%)}
.tab{
  flex:1 1 0;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--txt-3);border-radius:16px;
  background:transparent;border:0;font-family:inherit;cursor:pointer;
}
.tab:focus-visible{outline:2px solid var(--red);outline-offset:-2px}
.tab b{font-size:10.5px;font-weight:800;letter-spacing:.4px}
.tab.on{color:var(--red)}
.tab.on .tab-ic{
  width:44px;height:28px;border-radius:10px;background:rgba(255,59,78,.14);
  display:grid;place-items:center;
}

/* ---------- 播放器 ---------- */
.pl-top{
  display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex:0 0 auto;
}
.pl-top-t{flex:1 1 auto;min-width:0;text-align:center}
.pl-top-t b{display:block;font-size:14.5px;font-weight:900;letter-spacing:.4px;line-height:18px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-top-t span{display:block;font-size:10.5px;color:var(--txt-3);font-weight:700;margin-top:2px}
.pl-video{
  position:relative;height:200px;flex:0 0 auto;overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% 0%,rgba(255,90,60,.30),transparent 60%),
    radial-gradient(100% 100% at 20% 100%,rgba(59,130,246,.28),transparent 65%),
    linear-gradient(160deg,#1B1440 0%,#0B0D1C 60%,#080A14 100%);
}
.pl-video::after{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 18px);
}
.pl-mark{
  position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:7px;z-index:2;
}
.pl-live{
  display:flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:9px;
  background:var(--grad-red);color:#fff;font-size:11px;font-weight:900;letter-spacing:.8px;
  box-shadow:var(--shadow-red);
}
.pl-league{
  height:26px;padding:0 10px;border-radius:9px;background:rgba(255,255,255,.14);
  color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;
}
.pl-score{
  position:absolute;right:14px;top:14px;z-index:2;text-align:right;
}
.pl-score b{display:block;font-size:13px;font-weight:900;letter-spacing:.5px}
.pl-score span{display:block;font-size:10px;color:rgba(255,255,255,.62);font-weight:700}
.pl-center{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.pl-play{
  width:64px;height:64px;border-radius:50%;border:0;background:var(--grad-red);
  display:grid;place-items:center;color:#fff;box-shadow:0 8px 26px rgba(255,59,78,.5);
  padding-left:4px;
}
.pl-under{
  position:absolute;left:0;right:0;bottom:0;padding:0 12px 10px;z-index:3;
  background:linear-gradient(180deg,rgba(6,8,16,0),rgba(6,8,16,.92));
}
.pl-under-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pl-under-t span{font-size:11px;color:rgba(255,255,255,.72);font-weight:700}
.pl-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.pl-bar i{display:block;height:100%;width:26%;border-radius:3px;background:var(--grad-red)}
.pl-ctrls{display:flex;align-items:center;gap:8px;margin-top:9px}
.pl-ctrls .spacer{flex:1}
.pl-ic{
  width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.12);
  display:grid;place-items:center;color:#fff;
}
.pl-body{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:12px 16px 96px;display:flex;flex-direction:column;gap:11px}
.pl-body::-webkit-scrollbar{width:0;height:0}
.pl-info{
  display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:12px 14px;box-shadow:var(--shadow-1);
}
.pl-info .lg{width:44px;height:44px;border-radius:50%;overflow:hidden;position:relative;background:#fff;flex:0 0 auto}
.pl-info .lg img{width:100%;height:100%;object-fit:contain}
.pl-info .lg .fb{display:none;position:absolute;inset:0;background:var(--fb);color:#fff;align-items:center;justify-content:center;font-size:18px;font-weight:900}
.pl-info .lg.fail img{display:none}
.pl-info .lg.fail .fb{display:flex}
.pl-info-t{flex:1 1 auto;min-width:0}
.pl-info-t b{display:block;font-size:15px;font-weight:900;letter-spacing:.4px;line-height:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-info-t span{display:block;font-size:11px;color:var(--txt-3);font-weight:700;margin-top:3px}
.sec-title{display:flex;align-items:center;gap:8px}
.sec-title b{font-size:13px;font-weight:900;letter-spacing:.4px}
.sec-title span{font-size:10.5px;color:var(--txt-3);font-weight:700}
.sec-title .line{flex:1 1 auto;height:1px;background:var(--line)}
.seg-sig{margin:0;padding:5px;border-radius:20px}
.seg-sig .seg-btn{height:58px;flex-direction:column;gap:2px;line-height:1}
.seg-sig .seg-btn b{font-size:14px;font-weight:900}
.seg-sig .seg-btn em{font-size:10px;letter-spacing:.3px}
.snack{
  display:flex;align-items:center;gap:10px;border-radius:18px;padding:11px 12px;
  background:linear-gradient(135deg,rgba(255,194,75,.18),rgba(255,138,61,.10));
  border:1px solid rgba(255,194,75,.45);
}
.snack .ic{color:var(--warn);flex:0 0 auto}
.snack-t{flex:1 1 auto;min-width:0}
.snack-t b{display:block;font-size:12.5px;font-weight:900;color:var(--txt);line-height:17px}
.snack-t span{display:block;font-size:10.5px;color:var(--txt-2);font-weight:700;margin-top:2px;line-height:14px}
.snack-act{flex:0 0 auto;height:30px;padding:0 12px;border-radius:10px;background:rgba(255,194,75,.20);
  border:1px solid rgba(255,194,75,.5);color:var(--warn);font-size:11.5px;font-weight:900;font-family:inherit}
.src-row{
  display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:11px 13px;
}
.src-row .k{font-size:11.5px;color:var(--txt-3);font-weight:700;flex:0 0 auto}
.src-row .v{flex:1 1 auto;min-width:0;font-size:12px;font-weight:800;color:var(--txt-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.src-row .ic{color:var(--txt-3)}

/* 横向滑卡 */
.hscroll{
  display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:2px 16px 4px;margin:0 -16px;
  scroll-snap-type:x mandatory;
}
.hscroll::-webkit-scrollbar{height:0;width:0}
.hcard{
  flex:0 0 168px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);
  border-radius:20px;padding:11px 12px 12px;box-shadow:var(--shadow-1);overflow:hidden;cursor:pointer;
}
.hc-top{display:flex;align-items:center;gap:6px}
.hc-time{display:flex;align-items:baseline;gap:5px;margin-top:8px}
.hc-time b{font-size:19px;font-weight:900;letter-spacing:.4px;line-height:22px}
.hc-time span{font-size:10px;color:var(--txt-3);font-weight:700}
.hc-teams{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:9px}
.hc-vs{font-size:10px;font-weight:900;color:var(--txt-3)}
.hc-names{margin-top:8px;font-size:11.5px;font-weight:800;color:var(--txt-2);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-foot{margin-top:8px;display:flex}

/* ---------- 详情页 ---------- */
.dt-head{
  position:relative;flex:0 0 auto;padding:14px 16px 16px;overflow:hidden;
  background:
    radial-gradient(120% 100% at 50% -20%,rgba(59,130,246,.34),transparent 62%),
    linear-gradient(180deg,#151B3A 0%,var(--bg) 100%);
}
[data-theme="light"] .dt-head{
  background:
    radial-gradient(120% 100% at 50% -20%,rgba(37,99,235,.20),transparent 62%),
    linear-gradient(180deg,#FFFFFF 0%,var(--bg) 100%);
}
.dt-bar{display:flex;align-items:center;gap:8px}
.dt-bar h1{flex:1 1 auto;margin:0;font-size:16px;font-weight:900;letter-spacing:.4px;text-align:center}
.dt-meta{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:nowrap}
.dt-meta .t{font-size:12px;font-weight:800;color:var(--txt-2);white-space:nowrap}
.dt-vs{display:flex;align-items:center;gap:8px;margin-top:14px}
.dt-side{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.dt-side b{font-size:19px;font-weight:900;letter-spacing:.6px;line-height:23px;white-space:nowrap;
  max-width:100%;overflow:hidden;text-overflow:ellipsis}
.dt-mid{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px}
.dt-mid .vs{
  width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.10);
  border:1px solid var(--line-2);display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--txt-2);
}
[data-theme="light"] .dt-mid .vs{background:rgba(18,28,60,.06)}
.dt-mid small{font-size:9.5px;color:var(--txt-3);font-weight:800;letter-spacing:.6px}
.dt-body{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:12px 16px 170px;display:flex;flex-direction:column;gap:11px}
.dt-body::-webkit-scrollbar{width:0;height:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 11px;
  display:flex;flex-direction:column;gap:3px;min-width:0;
}
.tile-k{font-size:10.5px;color:var(--txt-3);font-weight:700;white-space:nowrap}
.tile b{font-size:14px;font-weight:900;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sig-list{display:flex;flex-direction:column;gap:8px}
.sig-row{
  display:flex;align-items:center;gap:10px;min-height:64px;padding:10px 12px;
  background:var(--card);border:1px solid var(--line);border-radius:18px;text-align:left;
  font-family:inherit;width:100%;color:inherit;
}
.sig-row .idx{
  width:30px;height:30px;border-radius:10px;background:var(--card-3);color:var(--txt-2);
  display:grid;place-items:center;font-size:12px;font-weight:900;flex:0 0 auto;
}
.sig-row .m{flex:1 1 auto;min-width:0}
.sig-row .m b{display:block;font-size:13.5px;font-weight:900;line-height:18px}
.sig-row .m span{display:block;font-size:10.5px;color:var(--txt-3);font-weight:700;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sig-note{margin:0;font-size:11px;line-height:17px;font-weight:600;color:var(--txt-3)}
.sig-note code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;background:var(--card-2);border-radius:4px;padding:1px 4px}
.sig-row.on{border-color:rgba(255,59,78,.55);background:linear-gradient(135deg,rgba(255,59,78,.14),rgba(255,138,61,.05))}
.sig-row.on .idx{background:var(--grad-red);color:#fff}
.sig-row .chev{flex:0 0 auto;color:var(--txt-3)}
.dt-cta{
  position:absolute;left:16px;right:16px;bottom:100px;height:54px;border:0;border-radius:18px;
  background:var(--grad-red);color:#fff;font-family:inherit;font-size:15px;font-weight:900;letter-spacing:.6px;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-red);z-index:15;
}
.secondary{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;
  display:flex;flex-direction:column;gap:9px;
}
.sec-row{display:flex;align-items:center;gap:9px}
.sec-row .k{font-size:11.5px;color:var(--txt-3);font-weight:700;flex:0 0 auto}
.sec-row .v{flex:1 1 auto;min-width:0;font-size:12px;font-weight:800;color:var(--txt-2);text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-row .ic{color:var(--txt-3);flex:0 0 auto}

/* ---------- 状态页 ---------- */
.state{
  flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 32px 96px;text-align:center;gap:0;
}
.state-ill{
  width:104px;height:104px;border-radius:34px;display:grid;place-items:center;margin-bottom:20px;
  background:var(--card);border:1px solid var(--line);color:var(--txt-2);box-shadow:var(--shadow-2);
}
.state-ill.err{background:linear-gradient(135deg,rgba(255,59,78,.20),rgba(255,138,61,.08));
  border-color:rgba(255,59,78,.38);color:#FF6B7A}
.state-ill.load{background:linear-gradient(135deg,rgba(59,130,246,.18),rgba(255,138,61,.08));
  border-color:rgba(59,130,246,.35);color:#7FB2FF}
.state h2{margin:0;font-size:19px;font-weight:900;letter-spacing:.5px;line-height:25px}
.state p{margin:8px 0 0;font-size:12.5px;color:var(--txt-2);font-weight:600;line-height:19px;max-width:280px}
.state .code{
  margin-top:10px;font-size:10.5px;color:var(--txt-3);font-weight:700;letter-spacing:.4px;
  background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;
}
.btn{
  margin-top:20px;height:48px;min-width:148px;padding:0 24px;border-radius:16px;border:0;
  background:var(--grad-red);color:#fff;font-family:inherit;font-size:14.5px;font-weight:900;letter-spacing:.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-red);
}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--txt-2);box-shadow:none}
.state .hint{margin-top:16px;font-size:11px;color:var(--txt-3);font-weight:700}

/* 骨架屏 */
.skel-list{padding:4px 16px 0;display:flex;flex-direction:column;gap:12px;width:100%}
.skel{
  background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 14px 16px;
  display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;
}
.skel::after{
  content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);
  animation:sh 1.4s infinite;
}
@keyframes sh{100%{left:120%}}
.sk{height:12px;border-radius:8px;background:var(--card-3)}
.sk-row{display:flex;align-items:center;gap:10px}
.sk-circle{width:40px;height:40px;border-radius:50%;background:var(--card-3);flex:0 0 auto}
.sk-line{display:flex;flex-direction:column;gap:8px;flex:1 1 auto}
.loading-note{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;
  font-size:12px;color:var(--txt-2);font-weight:700}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid var(--line-2);border-top-color:var(--red);
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<svg class="sv-defs" aria-hidden="true">

  <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.6 3 14.4 0 18M12 3c-3 3.6-3 14.4 0 18"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13.5a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2"/><path d="M14 10.5a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2"/></symbol>

  <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M6 9.5A13 13 0 0 1 12 7c2.4 0 4.6.7 6.5 2"/><path d="M9 13a7.5 7.5 0 0 1 6-.4"/><path d="M12 18.2v.1"/></symbol>

  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>

<script>
/* ============================================================
   数据（全部来自共享基座第 6 节的真实样本）
   ============================================================ */
const T = {
  celtics:{n:'凯尔特人',logo:'https://cdn.sportnanoapi.com/basketball/team/0dc24d08ef0b5584e0b70f967db64b36.png',c:'#0A7A3D'},
  hawks  :{n:'老鹰',  logo:'https://cdn.sportnanoapi.com/basketball/team/4e67b14905a05af9e1bd04406bf8690f.png',c:'#E03A3E'},
  zhejiang:{n:'浙江', logo:'http://www.jrszb444.com/d/file/p/2019/07-22/6da83cc0a417e07e2787d56b9c335a70.jpg',c:'#1E5AA8'},
  shandong:{n:'山东', logo:'http://www.jrszb444.com/d/file/p/2019/07-22/964df7d6987b40bff17f8b25cc0b1186.jpg',c:'#F26522'},
  qingdao :{n:'青岛', logo:'http://www.jrszb444.com/d/file/p/2019/07-17/ddf3e58f3df2f8c872c503b97c254681.jpg',c:'#0A5CAB'},
  liaoning:{n:'辽宁', logo:'http://www.jrszb444.com/d/file/p/2019/07-22/acb1277db8452ad3271a65207209575.jpg',c:'#C8102E'},
  shenzhen:{n:'深圳', logo:'http://www.jrszb444.com/d/file/p/2019/04-16/76af9384d3eb454a4d318ae371734d15.jpg',c:'#D32F2F'},
  guangsha:{n:'广厦', logo:'http://www.jrszb444.com/d/file/p/2019/07-22/964df7d6987b40bff17f8b25cc0b1186.jpg',c:'#1D4ED8'},
  lakers  :{n:'湖人',  logo:null,c:'#552583'},
  blazers:{n:'开拓者',logo:null,c:'#E03A3E'}
};
const L = {nba:'NBA', cba:'CBA'};

/* 播放方式（对应 app 的 StreamSource.isDirectHls）：
   只有源站 /play/sm.html 链路能静态解析成 m3u8 直连；
   JRS mgxl/pao 与 JRKAN wen/pao 是 XXTEA 加密 / 需令牌，只能由 WebView 承载。 */
const PLAY = {
  hls:{label:'直连 HLS', full:'直连 HLS (m3u8)'},
  web:{label:'网页播放', full:'网页播放 (WebView)'}
};

/* 该场次的线路表：只展示真实已知信息（源站 + 播放方式），不编造分辨率与可用性 */
const LINES = [
  {id:1, label:'信号1', provider:'JRS',   play:'hls'},
  {id:2, label:'信号2', provider:'JRS',   play:'web'},
  {id:3, label:'信号3', provider:'JRKAN', play:'web'}
];

/* 运行时状态：联赛筛选 + 当前选中线路 */
const state = {league:'', signal:1};

/* ============================================================
   组件工厂
   ============================================================ */
function logoHtml(key, size){
  const t = T[key];
  const fb = t.logo
    ? `<img src="${t.logo}" alt="${t.n}" onerror="this.parentNode.classList.add('fail')"><span class="fb">${t.n[0]}</span>`
    : `<span class="fb" style="display:flex;background:${t.c}">${t.n[0]}</span>`;
  return `<span class="logo ${size||''}" style="--fb:${t.c}">${fb}</span>`;
}
function icon(id, cls){ return `<svg class="ic ${cls||''}"><use href="#${id}"></use></svg>`; }

function tabbar(active, listId){
  const items = [
    ['list','i-grid','赛事', listId||'01-list-dark'],
    ['live','i-tv','直播','02-player-dark'],
    ['me','i-user','我的','08-profile-dark']
  ];
  return `<nav class="tabbar" role="tablist">${items.map(([k,ic,txt,go])=>`
    <button type="button" role="tab" aria-selected="${k===active}" class="tab ${k===active?'on':''}" data-go="${go}">
      <span class="tab-ic">${icon(ic,'ic-22')}</span><b>${txt}</b>
    </button>`).join('')}</nav>`;
}

function topbar(){
  return `<header class="topbar">
    <div class="brand">
      <span class="brand-mark">${icon('i-ball','ic-22')}</span>
      <span class="brand-txt"><b>NBA Live</b><span>SPORTS CENTER</span></span>
    </div>
    <span class="spacer"></span>
    <button class="icon-btn" aria-label="搜索">${icon('i-search','ic-22')}</button>
    <button class="icon-btn theme-btn" aria-label="切换主题">
      ${icon('i-moon','ic-22 ic-moon')}${icon('i-sun','ic-22 ic-sun')}
    </button>
  </header>`;
}

/* 联赛筛选：计数由 GROUPS 实时统计，空串 = 全部 */
function leagueCounts(){
  const c = {all:0, nba:0, cba:0};
  GROUPS.forEach(gr=>gr.items.forEach(g=>{
    c.all++;
    if(g.lg==='nba') c.nba++;
    if(g.lg==='cba') c.cba++;
  }));
  return c;
}
function leagueSeg(on){
  const c = leagueCounts();
  const segs = [['全部','',c.all],['NBA','nba',c.nba],['CBA','cba',c.cba]];
  return `<div class="seg" role="tablist">${segs.map(([t,key,n])=>`
    <button type="button" role="tab" aria-selected="${key===on}" class="seg-btn ${key===on?'is-on':''}" data-lg="${key}">${t}<em>${n}</em></button>`).join('')}</div>`;
}

/* 信号条数：signalCount = -1 表示尚未解析出线路数，不能当数字展示 */
function sigText(g){
  const n = g && typeof g.sig === 'number' ? g.sig : -1;
  return n < 0 ? '' : String(n);
}

/* 直播中的大卡 */
function liveCard(g){
  const sig = sigText(g);
  return `<article class="live-card">
    <div class="lc-top">
      <span class="lc-live"><i class="dot"></i>直播中</span>
      <span class="lc-time num">${g.time} 开赛</span>
    </div>
    <div class="lc-body">
      <div class="lc-side">${logoHtml(g.h,'lg-46')}<b>${T[g.h].n}</b></div>
      <span class="lc-vs">VS</span>
      <div class="lc-side">${logoHtml(g.a,'lg-46')}<b>${T[g.a].n}</b></div>
    </div>
    <div class="lc-foot">
      ${sig!==''?`<span class="chip">${icon('i-signal','ic-16')}${sig} 条线路</span>`:''}
      <span class="chip">${icon('i-stack','ic-16')}${g.src}</span>
      <button type="button" class="chip chip-btn" style="margin-left:auto" data-go="02-player-dark">${icon('i-play','ic-16')}立即观看</button>
    </div>
  </article>`;
}

/* 双列网格赛事卡 */
function miniCard(g){
  const st = g.status==='live'
    ? `<span class="st live"><i class="dot"></i>直播中</span>`
    : g.status==='done'
      ? `<span class="st done">${icon('i-check','ic-16')}已结束</span>`
      : `<span class="st soon">${icon('i-cal','ic-16')}${g.date.slice(5)} 开赛</span>`;
  const sig = sigText(g);
  return `<article class="mcard" role="button" tabindex="0" data-go="03-detail-dark">
    <div class="strip ${g.lg}"></div>
    <div class="mc-top">
      <span class="lg-chip ${g.lg}">${L[g.lg]}</span>
      ${sig!==''?`<span class="sig-badge">${icon('i-signal','ic-16')}${sig}</span>`:''}
    </div>
    <div class="mc-time"><b class="num">${g.time}</b><span class="num">${g.date}</span></div>
    <div class="mc-teams">
      <div class="mc-team">${logoHtml(g.h,'lg-40')}<b>${T[g.h].n}</b></div>
      <span class="mc-vs">VS</span>
      <div class="mc-team">${logoHtml(g.a,'lg-40')}<b>${T[g.a].n}</b></div>
    </div>
    <div class="mc-foot">${st}</div>
  </article>`;
}

/* ============================================================
   屏 A：赛事列表（可切换为 空/加载/错误 三态）
   ============================================================ */
const GROUPS = [
  {title:'今天 · 10月21日', tag:'CBA', hot:true, items:[
    {lg:'cba',date:'10-21',time:'19:35',h:'qingdao',a:'liaoning',sig:3,status:'live',src:'JRS'},
    {lg:'cba',date:'10-21',time:'19:35',h:'zhejiang',a:'shandong',sig:3,status:'soon',src:'JRKAN'},
    {lg:'cba',date:'10-21',time:'19:35',h:'shenzhen',a:'guangsha',sig:3,status:'done',src:'JRS'}
  ]},
  {title:'明天 · 10月22日', tag:'NBA', items:[
    {lg:'nba',date:'10-22',time:'07:00',h:'celtics',a:'hawks',sig:3,status:'soon',src:'JRKAN'},
    {lg:'nba',date:'10-22',time:'07:30',h:'lakers',a:'blazers',sig:3,status:'soon',src:'JRS'}
  ]}
];

/* 联赛筛选：只保留 NBA / CBA（与 app 的 League.supported 一致），空串 = 全部 */
function filterGroups(lg){
  return GROUPS.map(gr=>({
    title:gr.title, tag:gr.tag, hot:gr.hot,
    items:gr.items.filter(g=>!lg||g.lg===lg)
  })).filter(gr=>gr.items.length>0);
}

function listBody(lg){
  lg = lg||'';
  const groups = filterGroups(lg);
  const all = groups.reduce((a,gr)=>a.concat(gr.items),[]);
  const liveCount = all.filter(g=>g.status==='live').length;
  const sigTotal = all.reduce((n,g)=>n+(g.sig<0?0:g.sig),0);
  const live = all.filter(g=>g.status==='live')[0];
  let html = `
  <div class="quick">
    <div class="quick-i"><b class="num">${all.length}</b><span>赛事</span></div>
    <div class="quick-i live"><b class="num">${liveCount}</b><span>直播中</span></div>
    <div class="quick-i"><b class="num">${sigTotal}</b><span>信号</span></div>
  </div>`;
  if(!all.length){
    return html + `<div class="state"><div class="state-ill">${icon('i-ball','ic-28')}</div>
      <h2>该联赛暂无赛程</h2>
      <p>当前筛选条件下没有赛事，切换到「全部」查看全部 NBA / CBA 场次。</p>
      <button class="btn" type="button" data-lg="">${icon('i-refresh','ic-16')}查看全部赛事</button>
    </div>`;
  }
  groups.forEach((gr, gi)=>{
    html += `<div class="grp"><h2>${gr.title}</h2>${gr.hot?'<span class="tag hot">直播中</span>':''}<span class="line"></span><span class="tag">${gr.tag}</span></div>`;
    if(gi===0 && live && gr.items.indexOf(live)>=0){
      html += liveCard(live);
      const rest = gr.items.filter(g=>g!==live);
      if(rest.length){
        html += `<div class="grid2" style="margin-top:10px">${rest.map(miniCard).join('')}</div>`;
      }
    } else {
      html += `<div class="grid2">${gr.items.map(miniCard).join('')}</div>`;
    }
  });
  return html;
}

/* ============================================================
   组装 & 主题 / 屏幕切换 API
   ============================================================ */
const phone = document.getElementById('phone');
phone.innerHTML =
  listScreen('list') +
  playerHtml +
  detailHtml +
  listScreen('empty') +
  listScreen('loading') +
  listScreen('error') +
  profileHtml;

// 浅色版列表：克隆 01-list-dark 并强制浅色主题
const darkList = phone.querySelector('[data-screen="01-list-dark"]');
const lightList = darkList.cloneNode(true);
lightList.setAttribute('data-screen','04-list-light');
lightList.setAttribute('data-theme','light');
lightList.removeAttribute('data-variant');
phone.appendChild(lightList);

function showScreen(id){
  phone.querySelectorAll('.screen').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('data-screen')===id);
  });
  const sc = phone.querySelector(`[data-screen="${id}"] .scroll`);
  if(sc) sc.scrollTop = 0;
  return id;
}
window.__SHOW_SCREEN = showScreen;

function setTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
}
window.__SET_THEME = setTheme;

/* 联赛筛选：真正重新渲染列表，而不是只切一个 CSS 类 */
function setLeague(lg){
  state.league = lg || '';
  document.querySelectorAll('.seg-btn[data-lg]').forEach(b=>{
    const on = (b.getAttribute('data-lg')===state.league);
    b.classList.toggle('is-on', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('[data-list-body]').forEach(sc=>{
    sc.innerHTML = listBody(state.league);
  });
  return state.league;
}
window.__SET_LEAGUE = setLeague;

/* 选中线路：同步播放器分段控件、详情页线路行、CTA 文案与播放方式 */
function selectSignal(id){
  state.signal = Number(id);
  document.querySelectorAll('.seg-btn[data-sig]').forEach(b=>{
    const on = (Number(b.getAttribute('data-sig'))===state.signal);
    b.classList.toggle('is-on', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.querySelectorAll('.sig-row').forEach(r=>{
    r.classList.toggle('on', Number(r.getAttribute('data-sig'))===state.signal);
  });
  const line = LINES.find(l=>l.id===state.signal) || LINES[0];
  document.querySelectorAll('[data-play-mode]').forEach(el=>{
    el.textContent = `${line.provider} · ${PLAY[line.play].full}`;
  });
  document.querySelectorAll('[data-cta-label]').forEach(el=>{
    el.textContent = `去观看 · ${line.label}`;
  });
  return state.signal;
}
window.__SELECT_SIGNAL = selectSignal;

document.addEventListener('click', (e)=>{
  const t = e.target;
  if(!t || !t.closest) return;

  const themeBtn = t.closest('.theme-btn');
  if(themeBtn){
    const cur = document.documentElement.getAttribute('data-theme')==='light' ? 'dark' : 'light';
    setTheme(cur);
    return;
  }

  /* 联赛筛选：重新渲染列表 */
  const chip = t.closest('[data-lg]');
  if(chip){
    setLeague(chip.getAttribute('data-lg'));
    return;
  }

  /* 底部导航 / CTA / 赛事卡：跳屏 */
  const go = t.closest('[data-go]');
  if(go){
    showScreen(go.getAttribute('data-go'));
    return;
  }

  /* 播放器分段控件：切线路 */
  const sigBtn = t.closest('.seg-btn[data-sig]');
  if(sigBtn){
    selectSignal(sigBtn.getAttribute('data-sig'));
    return;
  }

  /* 详情页线路行：选中并进入播放器 */
  const sigRow = t.closest('.sig-row');
  if(sigRow){
    selectSignal(sigRow.getAttribute('data-sig'));
    showScreen('02-player-dark');
  }
});

/* role="button" 的卡片支持键盘操作 */
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const el = e.target && e.target.closest ? e.target.closest('[role="button"][data-go]') : null;
  if(!el) return;
  e.preventDefault();
  showScreen(el.getAttribute('data-go'));
});

window.__SCREENS = [
  {id:'01-list-dark',  name:'01-list-dark',  selector:'[data-screen="01-list-dark"]'},
  {id:'02-player-dark',name:'02-player-dark',selector:'[data-screen="02-player-dark"]'},
