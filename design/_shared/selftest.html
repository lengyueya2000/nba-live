<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>shoot.mjs 自检</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #000; color: #F8FAFC; }
  [data-screen] { width: 390px; height: 844px; padding: 24px; }
  .b { background: #E11D48; color: #fff; padding: 12px 20px; border-radius: 8px; }
</style>
</head>
<body>
  <div data-screen="list"><h2>赛事列表</h2><button class="b">直播中</button></div>
  <div data-screen="player" style="display:none"><h2>播放器</h2></div>
  <script>
    window.__SCREENS = [
      { id: 'list', name: '赛事列表', selector: '[data-screen="list"]' },
      { id: 'player', name: '播放器', selector: '[data-screen="player"]' },
    ];
  </script>
</body>
</html>
