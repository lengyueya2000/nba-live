# tag 推送即自动发版（04-P2-5 自动化版）：
#   两变体全量单测 -> 写入签名凭据 -> assembleRelease/bundleRelease
#   -> apksigner verify --print-certs -> mapping 作 artifact
#   -> 创建/更新 GitHub Release（只挂 APK + AAB）
#
# ⚠️ mapping.txt **绝不**挂到公开 Release：它是「混淆名 -> 原始名/行号」的全量对照表，
#    公开出去等于把 R8 混淆作废。它只作 workflow artifact，供线上崩溃还原。
#
# 演练（不新增 tag）：gh workflow run release.yml --ref <已存在的 tag>
name: Release（tag 触发）

on:
  push:
    tags:
      - 'v*'
  # 演练用：把本文件所在 ref 指定成一个已存在的 tag 再手动触发
  workflow_dispatch:

# 只需要写 Release 的权限，其余一律默认只读
permissions:
  contents: write

# 同一个 tag 只允许一条流水线在跑，避免重复发版争抢 Release 附件
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布 ${{ github.ref_name }}
    runs-on: ubuntu-latest
    # ⚠️ 这一步是 review/optimization-review.md **B9** 的落地：
    # 没有任何 `timeout-minutes` 时，某一步挂住（网络等待、交互式命令）
    # 会一直占着 GitHub 默认的 360 分钟上限；而 `concurrency.cancel-in-progress: false`
    # 又让同一 tag 的下一次触发只能排队 —— 发版窗口会被堵数小时。
    timeout-minutes: 30
    steps:
      - name: 校验触发 ref 必须是 v* tag
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*)
              echo "发版 tag：$GITHUB_REF_NAME"
              ;;
            *)
              echo "::error::发版只能由 v* tag 触发（当前 $GITHUB_REF）。演练请用：gh workflow run release.yml --ref <已存在的 tag>"
              exit 1
              ;;
          esac

      - name: Checkout（tag 构建需要完整历史）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      # ⚠️ 真实 runner 上最早、最硬的一次失败就在这里：
      # `gradlew` 在 git 里的模式位若不是 100755，ubuntu 上 `./gradlew` 会直接
      # `Permission denied`（exit 126）—— 整条流水线在第一步就挂，而本地 Windows
      # 永远看不出来。所以由流水线自己保证，不依赖"克隆方保留了执行位"。
      - name: 确保 gradlew 可执行
        shell: bash
        run: chmod +x gradlew

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle（含依赖与构建缓存）
        uses: gradle/actions/setup-gradle@v4

      - name: 校验 Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: 校验 tag 与 versionName 一致
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep -E '^ *versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "v$VERSION_NAME" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 app/build.gradle.kts 的 versionName $VERSION_NAME 不一致 —— 拒绝发版"
            exit 1
          fi
          echo "版本号核对通过：$GITHUB_REF_NAME"

      # ⚠️ 测试不过就不许发：release 变体也会被 BuildConfig / 压缩路径的改动影响
      - name: 两变体全量单测
        run: ./gradlew :app:testDebugUnitTest :app:testReleaseUnitTest --rerun-tasks

      - name: 检查签名 secrets（缺失就明确失败）
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少签名 secret：$missing —— 没有凭据就不发版，绝不产出未签名 APK。"
            exit 1
          fi

      - name: 写入签名凭据（键名与 app/build.gradle.kts 一致）
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          # ⚠️ 键名必须与 app/build.gradle.kts 的 requiredKeystoreKeys 完全一致：
          #    storeFile / storePassword / keyAlias / keyPassword
          # storeFile 写相对路径：build.gradle.kts 用 rootProject.file(...) 解析到仓库根
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            release.jks "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          test -s release.jks
          test -s keystore.properties

      # 缺凭据时 build.gradle.kts 会直接抛 GradleException，绝不静默产出未签名包
      - name: 打包 APK + AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: apksigner 验签 + 版本号核对
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          # 未签名包会被命名为 app-UNSIGNED-release.apk：出现即说明凭据没生效，绝不发布
          if ls app/build/outputs/apk/release/app-UNSIGNED-*.apk >/dev/null 2>&1; then
            echo "::error::产出了未签名包（app-UNSIGNED-*.apk）—— 绝不发布"
            exit 1
          fi
          echo "使用 build-tools：$BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee /tmp/apksigner-verify.txt
          # ⚠️ aapt2/aapt 的 badging 只是给人看的附注，**绝不能因为它失败而让发版失败**：
          #    本步骤是 `set -euo pipefail`，而 `… | head -1` 在输出较长时会让生产者
          #    吃 SIGPIPE(141) → 管道失败 → 发版中断。所以先落盘再 head，并显式兜底。
          { "$BUILD_TOOLS/aapt2" dump badging "$APK" > /tmp/badging.txt 2>/dev/null \
              || "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/badging.txt 2>/dev/null \
              || echo "(aapt2/aapt dump badging 不可用)" > /tmp/badging.txt; }
          {
            echo '## 签名与版本核对'
            echo '```'
            cat /tmp/apksigner-verify.txt
            head -1 /tmp/badging.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ 这一步是 review/optimization-review.md **H1** 的落地：
      # 此前流水线只核对**源码**里的 versionName（见上面"校验 tag 与 versionName 一致"），
      # 而 `versionCode` 是**手工**维护的、产物里的版本号只是"贴进 Summary 的附注"。
      # 于是"只改 versionName、忘了 +1 versionCode"能整条流水线全绿地发出去：
      #   - versionCode 变小 → 已安装用户 INSTALL_FAILED_VERSION_DOWNGRADE，永久收不到更新；
      #   - versionCode 不变 → 自动更新识别不出这是新版，且这个号被占死、回退发版也装不上。
      # 现在对**产物**断言：包名 / versionName 与 tag 三方一致、versionCode 与源码一致，
      # 并且**严格大于上一版 Release 的 versionCode**（拿不到上一版时降级为内置下限 + 警告）。
      - name: 核对**产物**版本号与 versionCode 单调递增（H1）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 上一步的变量不跨 step 传递，这里自己再解析一次（drill 过：SDK 路径在 ubuntu runner 上来自 ANDROID_HOME）
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          # 内置下限：低于它一律拒绝（防止"上一版拿不到"时这条判据完全失效）
          MIN_RELEASE_VERSION_CODE=28

          if ! grep -q "^package: name='" /tmp/badging.txt; then
            echo "::error::产物里读不到包信息（aapt2/aapt badging 不可用）—— 无法核对版本号，拒绝发版"
            exit 1
          fi
          PROD_PKG="$(grep -m1 -o "package: name='[^']*'" /tmp/badging.txt | sed -E "s/package: name='([^']*)'/\1/")"
          PROD_VCODE="$(grep -m1 -o "versionCode='[0-9]*'" /tmp/badging.txt | sed -E "s/versionCode='([0-9]*)'/\1/")"
          PROD_VNAME="$(grep -m1 -o "versionName='[^']*'" /tmp/badging.txt | sed -E "s/versionName='([^']*)'/\1/")"
          SRC_VCODE="$(grep -E '^ *versionCode' app/build.gradle.kts | head -1 | grep -o '[0-9]\+')"
          SRC_VNAME="$(grep -E '^ *versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"

          if [ -z "$PROD_VCODE" ] || [ -z "$PROD_VNAME" ] || [ -z "$SRC_VCODE" ]; then
            echo "::error::版本号解析失败（产物 vName='$PROD_VNAME' vCode='$PROD_VCODE' / 源码 vCode='$SRC_VCODE'）—— 拒绝发版"
            exit 1
          fi
          if [ "$PROD_PKG" != "com.nbalive.app" ]; then
            echo "::error::产物包名 '$PROD_PKG' 不是 com.nbalive.app —— 拒绝发版"
            exit 1
          fi
          if [ "$PROD_VNAME" != "$SRC_VNAME" ] || [ "v$PROD_VNAME" != "$GITHUB_REF_NAME" ]; then
            echo "::error::产物 versionName='$PROD_VNAME' ≠ 源码 '$SRC_VNAME' 或 tag '$GITHUB_REF_NAME' —— 拒绝发版"
            exit 1
          fi
          if [ "$PROD_VCODE" != "$SRC_VCODE" ]; then
            echo "::error::产物 versionCode=$PROD_VCODE ≠ 源码声明 $SRC_VCODE —— 拒绝发版"
            exit 1
          fi

          # 上一版 Release 的 versionCode：下载它的 APK 现读（比"缓存里记一笔"更难被绕过）
          PREV_VCODE=""
          PREV_TAG="$(gh release list --limit 30 --json tagName,createdAt \
            --jq "[.[] | select(.tagName != \"$GITHUB_REF_NAME\")] | sort_by(.createdAt) | reverse | .[0].tagName" 2>/dev/null || true)"
          if [ -n "${PREV_TAG:-}" ] && [ "$PREV_TAG" != "null" ]; then
            PREV_DIR="$(mktemp -d)"
            if gh release download "$PREV_TAG" --pattern '*.apk' --dir "$PREV_DIR" 2>/dev/null; then
              PREV_APK="$(ls "$PREV_DIR"/*.apk 2>/dev/null | head -1 || true)"
              if [ -n "${PREV_APK:-}" ]; then
                { "$BUILD_TOOLS/aapt2" dump badging "$PREV_APK" 2>/dev/null \
                    || "$BUILD_TOOLS/aapt" dump badging "$PREV_APK" 2>/dev/null; } > "$PREV_DIR/prev-badging.txt" || true
                PREV_VCODE="$(grep -m1 -o "versionCode='[0-9]*'" "$PREV_DIR/prev-badging.txt" 2>/dev/null | sed -E "s/versionCode='([0-9]*)'/\1/" || true)"
              fi
            fi
            echo "上一版 tag=$PREV_TAG versionCode=${PREV_VCODE:-（读不到）}"
          fi

          if [ -n "${PREV_VCODE:-}" ]; then
            if [ "$PROD_VCODE" -le "$PREV_VCODE" ]; then
              echo "::error::versionCode 没有递增：本版 $PROD_VCODE ≤ 上一版（$PREV_TAG）$PREV_VCODE —— 拒绝发版（H1）"
              exit 1
            fi
            echo "versionCode 递增核对通过：$PREV_VCODE → $PROD_VCODE"
          else
            if [ "$PROD_VCODE" -lt "$MIN_RELEASE_VERSION_CODE" ]; then
              echo "::error::读不到上一版 Release，且本版 versionCode=$PROD_VCODE 低于下限 $MIN_RELEASE_VERSION_CODE —— 拒绝发版（H1）"
              exit 1
            fi
            echo "::warning::未能取到上一版 Release 的 versionCode，已降级为下限断言（≥$MIN_RELEASE_VERSION_CODE）—— 手工确认递增"
          fi

      - name: 上传 R8 mapping（只作 artifact，绝不挂 Release）
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: 上传 APK/AAB artifact（排障用）
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: 创建 / 更新 GitHub Release（只挂 APK + AAB）
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          # ⚠️ 这里绝不出现 mapping：混淆映射只作 artifact（公开 Release 等于把混淆作废）
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" --clobber
          else
            gh release create "$TAG" "$APK" "$AAB" --title "$TAG" --generate-notes
          fi